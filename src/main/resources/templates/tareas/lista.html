<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Tareas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .navbar-brand { font-weight: 700; letter-spacing:.2px }
        .page-header { gap: .75rem }
        .badge-state { font-size:.85rem }
        @media (max-width: 576px) {
          .table-responsive { border-radius:0 }
          .btn-group .btn { font-size:.9rem }
        }
    </style>
</head>

<body class="bg-light">

<!-- NAV -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/tareas/hoy">TareasApp</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="topbar" class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a th:classappend="${vista}=='hoy' ? ' active'"
                       class="nav-link"
                       href="/tareas/hoy">
                        <i class="bi bi-calendar-check"></i> Hoy
                    </a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${vista}=='pendientes' ? ' active'"
                       class="nav-link"
                       href="/tareas/pendientes">
                        <i class="bi bi-hourglass-split"></i> Pendientes
                    </a>
                </li>
                <li class="nav-item">
                    <a th:classappend="${vista}=='completadas' ? ' active'"
                       class="nav-link"
                       href="/tareas/completadas">
                        <i class="bi bi-check2-circle"></i> Completadas
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/usuarios">
                        <i class="bi bi-people"></i> Usuarios
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <button type="button" id="themeToggle"
                        class="btn btn-outline-secondary btn-sm"
                        aria-label="Cambiar tema">
                    <i id="themeIcon" class="bi bi-moon"></i>
                </button>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input th:if="${_csrf != null}" type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container py-4">

    <!-- Header + acciones -->
    <div class="d-flex flex-wrap justify-content-between align-items-center page-header mb-3">
        <div>
            <h4 class="mb-0"
                th:text="${vista}=='hoy' ? 'Tareas de hoy'
                         : (${vista}=='pendientes' ? 'Todas las pendientes' : 'Completadas')">
                Tareas
            </h4>
            <small class="text-muted" th:if="${#lists.size(tareas) > 0}"
                   th:text="${#lists.size(tareas)} + ' resultado(s)'">
                0 resultado(s)
            </small>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrear">
                <i class="bi bi-plus-lg"></i> Nueva tarea
            </button>
            <button class="btn btn-outline-dark" data-bs-toggle="offcanvas" data-bs-target="#filtros">
                <i class="bi bi-search"></i> Buscar / Filtrar
            </button>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width:26%">Título</th>
                        <th style="width:28%">Descripción</th>
                        <!-- NUEVO: columna usuario -->
                        <th style="width:16%">Creada por</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${tareas}">
                        <td class="fw-medium" th:text="${t.titulo}">Título</td>
                        <td class="text-muted"
                            th:text="${t.descripcion} ?: '-'">
                            Descripción
                        </td>
                        <!-- NUEVO: muestra el nombre del usuario o '—' si es null -->
                        <td th:text="${t.usuario != null ? t.usuario.nombre : '—'}">usuario</td>
                        <td>
                            <i class="bi bi-calendar-event me-1"></i>
                            <span th:text="${t.fechaVencimiento}">2025-11-04</span>
                        </td>
                        <td>
                            <span th:if="${t.completada}" class="badge bg-success badge-state">
                                <i class="bi bi-check2"></i> Completada
                            </span>
                            <span th:unless="${t.completada}" class="badge bg-warning text-dark badge-state">
                                <i class="bi bi-hourglass"></i> Pendiente
                            </span>
                        </td>
                        <td class="text-end">
                            <form th:if="${!t.completada}"
                                  th:action="@{'/tareas/' + ${t.id} + '/completar'}"
                                  method="post"
                                  class="d-inline">
                                <input th:if="${_csrf != null}" type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <button class="btn btn-sm btn-outline-success">
                                    <i class="bi bi-check2-circle"></i> Completar
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tareas)}">
                        <!-- antes era colspan="5", ahora hay 6 columnas -->
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox"></i> Sin resultados
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<!-- MODAL: Crear -->
<div class="modal fade" id="modalCrear" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form th:action="@{/tareas}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-plus-circle"></i> Crear tarea
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input th:if="${_csrf != null}" type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input name="titulo" class="form-control"
                           placeholder="Ej: Llamar al proveedor" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control"
                              rows="3" placeholder="Detalles…"></textarea>
                </div>
                <div>
                    <label class="form-label">Fecha</label>
                    <input type="date" name="fechaVencimiento" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary">
                    <i class="bi bi-save2"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- OFFCANVAS: Buscar / Filtrar -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="filtros">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">
            <i class="bi bi-funnel"></i> Buscar / Filtrar
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">

        <!-- Buscar por título + estado actual -->
        <form th:action="@{/tareas/filtrar}" method="get" class="mb-4">
            <input type="hidden" name="estado" th:value="${vista} ?: 'pendientes'">
            <label class="form-label">Buscar por título</label>
            <div class="input-group">
                <input name="q" th:value="${q}" class="form-control"
                       placeholder="Ej: factura, reunión…">
                <button class="btn btn-outline-primary">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </form>

        <!-- Rango de fechas (mantiene estado + q) -->
        <form th:action="@{/tareas/filtrar}" method="get" class="row g-2">
            <input type="hidden" name="estado" th:value="${vista} ?: 'pendientes'">
            <input type="hidden" name="q" th:value="${q}">
            <div class="col-12">
                <label class="form-label">Rango de fechas</label>
            </div>
            <div class="col-6">
                <input type="date" name="desde" class="form-control" th:value="${desde}">
            </div>
            <div class="col-6">
                <input type="date" name="hasta" class="form-control" th:value="${hasta}">
            </div>
            <div class="col-12 d-grid">
                <button class="btn btn-outline-dark">
                    <i class="bi bi-calendar-range"></i> Aplicar
                </button>
            </div>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{fragments/theme :: theme-toggle-script}"></th:block>
</body>
</html>
