<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Login - TareasApp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="mb-0">TareasApp</h3>
                        <button type="button" id="themeToggle" class="btn btn-sm btn-outline-secondary" aria-label="Cambiar tema">
                            <i id="themeIcon" class="bi bi-moon"></i>
                        </button>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos</div>
                    <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada</div>

                    <form th:action="@{/login}" method="post" class="vstack gap-3">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div>
                            <label class="form-label">Usuario</label>
                            <input name="username" class="form-control" required autofocus>
                        </div>
                        <div>
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button class="btn btn-primary w-100">Ingresar</button>
                    </form>

                    <p class="text-center text-muted mt-3 mb-0">&copy; 2025</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{fragments/theme :: theme-toggle-script}"></th:block>
</body>
</html>
