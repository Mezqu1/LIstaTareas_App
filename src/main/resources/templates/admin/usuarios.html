<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/tareas/hoy">TareasApp</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a class="btn btn-outline-primary btn-sm" href="/tareas/hoy"><i class="bi bi-card-checklist"></i> Tareas</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h4 class="mb-0">Usuarios</h4>
            <small class="text-muted" th:if="${usuarios != null}"
                   th:text="${#lists.size(usuarios)} + ' usuario(s)'">0</small>
        </div>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Nuevo usuario
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Roles</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.nombre}">nombre</td>
                    <td>
            <span class="badge text-bg-secondary me-1"
                  th:each="r : ${u.roles}"
                  th:text="${#strings.replace(r,'ROLE_','')}">USER</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/admin/usuarios/' + ${u.id} + '/editar'}"
                           class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil-square"></i> Editar</a>

                        <form th:if="${u.nombre != #authentication.name}"
                              th:action="@{'/admin/usuarios/' + ${u.id} + '/eliminar'}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar usuario?');">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${usuarios == null or usuarios.isEmpty()}">
                    <td colspan="4" class="text-center text-muted py-4"><i class="bi bi-inbox"></i> No hay usuarios</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
