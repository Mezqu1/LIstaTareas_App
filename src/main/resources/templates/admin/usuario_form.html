<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title th:text="${esEdicion} ? 'Editar usuario' : 'Nuevo usuario'">Usuario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body">

<nav class="navbar bg-white border-bottom">
    <div class="container d-flex align-items-center justify-content-between">
        <a href="/admin/usuarios" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Volver
        </a>

        <span class="navbar-brand mb-0 h5"
              th:text="${esEdicion} ? 'Editar usuario' : 'Crear usuario'">Usuario</span>

        <button type="button" id="themeToggle" class="btn btn-outline-secondary btn-sm">
            <i id="themeIcon" class="bi bi-moon"></i>
        </button>
    </div>
</nav>

<div class="container py-4" style="max-width:720px">

    <!-- Mensajes -->
    <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
    <div th:if="${msg}" class="alert alert-success mb-3" th:text="${msg}"></div>

    <div class="card shadow-sm">
        <form th:action="${esEdicion} ? @{/admin/usuarios/{id}/editar(id=${usuario.id})}
                                      : @{/admin/usuarios/nuevo}"
              th:object="${usuario}"
              method="post"
              class="card-body">

            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input th:field="*{nombre}" class="form-control" autocomplete="username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password"
                       th:field="*{password}"
                       class="form-control"
                       th:attr="required=${!esEdicion}"
                       minlength="8"
                       autocomplete="new-password">
                <div class="form-text">
                    <span th:text="${esEdicion} ? 'Dejá en blanco para no cambiar la contraseña.'
                                               : 'Mínimo 8 caracteres.'">
                        Mínimo 8 caracteres.
                    </span>
                </div>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input"
                       type="checkbox" name="esAdmin" id="esAdmin"
                       th:checked="${usuario.roles != null and usuario.roles.contains('ROLE_ADMIN')}">
                <label class="form-check-label" for="esAdmin">Es Admin</label>
            </div>

            <div class="d-grid">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-save"></i>
                    <span th:text="${esEdicion} ? 'Guardar cambios' : 'Crear usuario'">Guardar</span>
                </button>
            </div>
        </form>
    </div>

    <p class="mt-3 text-center text-muted small">&copy; 2025 TareasApp</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{fragments/theme :: theme-toggle-script}"></th:block>
</body>
</html>
