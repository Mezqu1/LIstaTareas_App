<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title th:text="${esEdicion} ? 'Editar tarea' : 'Nueva tarea'">Tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="mb-3" th:text="${esEdicion} ? 'Editar Tarea' : 'Crear Tarea'"></h4>


                    <form th:action="${esEdicion} ? @{'/admin/tareas/' + ${tarea.id}} : @{/admin/tareas}"
                          method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">


                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <select name="usuarioId" class="form-select" required>
                                <option th:each="u : ${usuarios}" th:value="${u.id}"
                                        th:selected="${tarea.usuario != null and u.id == tarea.usuario.id}"
                                        th:text="${u.nombre}"></option>
                            </select>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input class="form-control" name="titulo" th:value="${tarea.titulo}" required>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" name="descripcion" rows="3" th:text="${tarea.descripcion}"></textarea>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">Fecha de vencimiento</label>
                            <input type="date" class="form-control" name="fechaVencimiento" th:value="${tarea.fechaVencimiento}">
                        </div>


                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" name="completada" th:checked="${tarea.completada}">
                            <label class="form-check-label">Completada</label>
                        </div>


                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" name="archivada" th:checked="${tarea.archivada}">
                            <label class="form-check-label">Archivada</label>
                        </div>


                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit" th:text="${esEdicion} ? 'Guardar cambios' : 'Crear'"></button>
                            <a class="btn btn-secondary" th:href="@{/admin/tareas}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
            <p class="mt-3 text-center text-muted small">&copy; 2025 TareasApp</p>
        </div>
    </div>
</div>
</body>
</html>
