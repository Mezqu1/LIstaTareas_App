<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Tareas - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/tareas/hoy">TareasApp</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <button type="button" id="themeToggle" class="btn btn-outline-secondary btn-sm" aria-label="Cambiar tema">
                <i id="themeIcon" class="bi bi-moon"></i>
            </button>
            <a class="btn btn-outline-primary btn-sm" href="/tareas/hoy"><i class="bi bi-card-checklist"></i> Tareas</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Filtros básicos opcionales (q, fechas) -->
    <form class="row g-2 mb-3" th:action="@{/admin/tareas}" method="get">
        <div class="col-md-4">
            <input type="text" class="form-control" name="q" th:value="${q}" placeholder="Buscar en título o descripción">
        </div>
        <div class="col-md-3">
            <input type="date" class="form-control" name="desde" th:value="${desde}">
        </div>
        <div class="col-md-3">
            <input type="date" class="form-control" name="hasta" th:value="${hasta}">
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-primary">Filtrar</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Usuario</th>
                    <th>Vence</th>
                    <th>Estado</th>
                    <th>Archivada</th>
                    <th style="width:240px" class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tareas}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.titulo}"></td>
                    <td th:text="${t.usuario != null ? t.usuario.nombre : '—'}"></td>
                    <td th:text="${t.fechaVencimiento}"></td>
                    <td>
            <span th:classappend="${t.completada} ? 'badge bg-success' : 'badge bg-warning text-dark'"
                  th:text="${t.completada} ? 'Completada' : 'Pendiente'"></span>
                    </td>
                    <td>
            <span th:classappend="${t.archivada} ? 'badge bg-secondary' : 'badge bg-light text-dark border'"
                  th:text="${t.archivada} ? 'Sí' : 'No'"></span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-warning" th:href="@{'/admin/tareas/' + ${t.id} + '/editar'}">Editar</a>
                        <form th:if="${!t.archivada}" th:action="@{'/admin/tareas/' + ${t.id} + '/archivar'}" method="post" class="d-inline">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-secondary">Archivar</button>
                        </form>
                        <form th:if="${t.archivada}" th:action="@{'/admin/tareas/' + ${t.id} + '/desarchivar'}" method="post" class="d-inline">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-dark">Desarchivar</button>
                        </form>
                        <form th:action="@{'/admin/tareas/' + ${t.id} + '/eliminar'}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar tarea?');">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tareas)}">
                    <td colspan="7" class="text-center text-muted py-3">Sin resultados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{fragments/theme :: theme-toggle-script}"></th:block>
</body>
</html>
